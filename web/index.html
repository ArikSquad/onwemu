<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A private, bring-your-own-ROM NES, Game Boy, and PSP emulator.">
  <title>onwemu — your ROM, your browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><a class="brand" href="/">onwemu<span>◼</span></a><div class="privacy">runs locally</div></header>
  <main>
    <section class="hero" id="picker">
      <h1>Bring the game.<br><em>We’ll bring the console.</em></h1>
      <p class="lede">Drop a ROM you own. It runs through WASM on your browser.</p>
      <div class="systems" role="radiogroup" aria-label="Console">
        <button class="system active" data-system="nes" role="radio" aria-checked="true"><b>NES</b><small>.nes</small></button>
        <button class="system" data-system="gb" role="radio" aria-checked="false"><b>GAME BOY</b><small>.gb</small></button>
        <button class="system" data-system="psp" role="radio" aria-checked="false"><b>PSP</b><small>.iso · .chd · .pbp · .elf</small></button>
      </div>
      <label class="drop" id="drop"><input id="rom" type="file" accept=".nes" hidden><span class="plus">＋</span><strong>Choose a ROM</strong><small>or drop it right here</small></label>
      <p class="error" id="error" role="alert"></p>
    </section>
    <section class="player" id="player" hidden>
      <div class="player-bar"><div><span id="lamp"></span><b id="filename">ROM</b></div><div class="player-actions"><button id="fullscreen" type="button" aria-pressed="false">Fullscreen</button><button id="change" type="button">Change game</button></div></div>
      <div class="screen-wrap"><canvas id="screen"></canvas></div>
      <div class="controls" id="controls"></div>
    </section>
  </main>
  <footer><span>onwemu © 2026 ArikSquad. PSP-enabled app: AGPL-3.0-only; no warranty; redistribution allowed.</span><a href="https://github.com/ArikSquad/onwemu">Source</a><a href="https://github.com/ArikSquad/onwemu/blob/main/psp/LICENSE">AGPL license</a><a href="https://github.com/ArikSquad/nesma">NESMA</a><a href="https://github.com/ArikSquad/gbsml">GBSML</a></footer>
  <script type="module" src="app.js"></script>
</body></html>
