[package]
name = "gbsml"
version = "0.1.0"
edition = "2024"
description = "A clean, cycle-driven Nintendo Game Boy DMG emulator"
license = "MIT"

[features]
default = []
desktop = ["dep:minifb"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
minifb = { version = "0.28", optional = true }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "gbsml"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "gbsml-headless"
path = "src/bin/headless.rs"

