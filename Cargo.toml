[package]
name = "onwemu"
version = "0.1.0"
edition = "2024"
description = "A private, bring-your-own-ROM NES, Game Boy, and PSP emulator for the web"
# This license applies to onwemu's own source. See LICENSING.md for the PSP
# runtime dependency and the combined browser build.
license = "MIT"

[features]
default = []
desktop = ["dep:minifb"]
web = ["dep:wasm-bindgen", "dep:console_error_panic_hook", "dep:psp-runtime"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
minifb = { version = "0.28", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
psp-runtime = { path = "psp/crates/psp-runtime", optional = true, default-features = false }

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "gbsml"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "gbsml-headless"
path = "src/bin/headless.rs"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
